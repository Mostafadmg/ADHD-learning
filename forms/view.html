<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Original form · ADHD for Clinicians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<link rel="icon" href="data:,">
<style>
:root{--navy:#16324f;--teal:#0b6664;--teal-l:#e3f4f3;--muted:#55626f;--line:#dde3ea}
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;color:#1d2733;font-family:'Fredoka','Segoe UI',system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 1rem}
.bar b{flex:1 1 auto}
.bar a,.bar button{font:inherit;font-size:.9rem;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:.4rem .9rem;cursor:pointer;text-decoration:none}
.bar .pri{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.note{max-width:900px;margin:.8rem auto 0;padding:.6rem .9rem;border-radius:10px;background:#fff;font-size:.9rem;color:var(--muted)}
.note b{color:var(--navy)}
#pages{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1rem}
.pg{position:relative;background:#fff;box-shadow:0 2px 12px rgba(22,50,79,.15)}
.pg canvas{display:block}
.pg .annotationLayer{position:absolute;inset:0}
.annotationLayer input,.annotationLayer textarea,.annotationLayer select{background:rgba(227,244,243,.6)!important}
.err{max-width:640px;margin:3rem auto;text-align:center;background:#fff;padding:1.5rem;border-radius:12px}
@media print{.bar,.note{display:none}body{background:#fff}#pages{padding:0;gap:0}.pg{box-shadow:none;page-break-after:always}}
</style>
</head>
<body>
<div class="bar"><b id="ttl">Original form</b><button type="button" class="pri" id="dl">Download</button><button type="button" id="pr">Print</button><a id="raw" target="_blank" rel="noopener">Open in browser’s PDF viewer</a><a href="../index.html#form-library">Back to the form library</a></div>
<p class="note" id="note">Loading…</p>
<div id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Viewer for the original forms in forms/official/. Renders every page; fillable PDFs (PCL-5, SNAP-IV) can be typed
   into here, and Download saves a copy that includes what was typed. Works in browsers that cannot show PDFs. */
(function(){
  'use strict';
  var NAMES = {'asrs-v1-1.pdf':'ASRS v1.1 Symptom Checklist','wfirs-s.pdf':'WFIRS-S','wsr-ii.pdf':'WSR-II','snap-iv-26.pdf':'SNAP-IV 26-item','snap-iv-26-fillable.pdf':'SNAP-IV 26-item (fillable)','phq-9.pdf':'PHQ-9','gad-7.pdf':'GAD-7','audit.pdf':'AUDIT','audit-c.pdf':'AUDIT-C','aq-10.pdf':'AQ-10','pcl-5.pdf':'PCL-5','c-ssrs-screener.pdf':'C-SSRS screener'};
  var f = new URLSearchParams(location.search).get('f') || '';
  var note = document.getElementById('note'), pagesEl = document.getElementById('pages');
  if(!NAMES[f]){ note.className = 'err'; note.innerHTML = '<b>Form not found.</b> Open forms from the standalone form library.'; return; }
  var url = 'official/' + f, title = NAMES[f];
  document.title = title + ' · ADHD for Clinicians'; document.getElementById('ttl').textContent = title + ' (original)';
  document.getElementById('raw').href = url;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var linkService = {externalLinkTarget: 2, externalLinkRel: 'noopener', externalLinkEnabled: true, getDestinationHash: function(){ return '#'; }, getAnchorUrl: function(a){ return a; }, addLinkAttributes: function(link, href){ link.href = href; link.target = '_blank'; link.rel = 'noopener'; }, navigateTo: function(){}, goToDestination: function(){}, executeNamedAction: function(){}, executeSetOCGState: function(){}, isInPresentationMode: false};
  var doc;
  pdfjsLib.getDocument(url).promise.then(function(pdf){
    doc = pdf;
    return pdf.getFieldObjects().then(function(fields){
      var fillable = fields && Object.keys(fields).length;
      note.innerHTML = fillable ? '<b>This form is fillable.</b> Click the boxes to type or tick, then press Download to save your filled copy, or Print.' : '<b>This is the original printed form.</b> Print it, or use “Fill in our version” in the course for an on-screen copy with live scoring.';
      var chain = Promise.resolve();
      for(var i = 1; i <= pdf.numPages; i++) (function(n){ chain = chain.then(function(){ return renderPage(n, fields); }); })(i);
      return chain;
    });
  }).catch(function(e){ note.className = 'err'; note.innerHTML = '<b>The form could not be shown here.</b> <a href="' + url + '">Open the PDF directly</a>.'; });
  function renderPage(n, fields){
    return doc.getPage(n).then(function(page){
      var scale = Math.min(1.5, (Math.min(window.innerWidth, 1000) - 32) / page.getViewport({scale:1}).width);
      var vp = page.getViewport({scale: scale}), ratio = window.devicePixelRatio || 1;
      var wrap = document.createElement('div'); wrap.className = 'pg'; wrap.style.width = vp.width + 'px'; wrap.style.height = vp.height + 'px';
      var c = document.createElement('canvas'); c.width = Math.floor(vp.width * ratio); c.height = Math.floor(vp.height * ratio); c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
      wrap.appendChild(c); pagesEl.appendChild(wrap);
      var ctx = c.getContext('2d'); ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return page.render({canvasContext: ctx, viewport: vp, annotationMode: pdfjsLib.AnnotationMode.ENABLE_FORMS}).promise.then(function(){
        return page.getAnnotations({intent: 'display'});
      }).then(function(annots){
        if(!annots.length) return;
        var al = document.createElement('div'); al.className = 'annotationLayer'; wrap.appendChild(al);
        var layer = new pdfjsLib.AnnotationLayer({div: al, accessibilityManager: null, annotationCanvasMap: null, page: page, viewport: vp.clone({dontFlip: true})});
        return layer.render({annotations: annots, imageResourcesPath: '', renderForms: true, linkService: linkService, downloadManager: null, annotationStorage: doc.annotationStorage, enableScripting: false, hasJSActions: false, fieldObjects: fields});
      });
    });
  }
  document.getElementById('dl').addEventListener('click', function(){
    if(!doc) return;
    doc.saveDocument().then(function(bytes){
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'})); a.download = f.replace('.pdf', '') + '-filled.pdf';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    }).catch(function(){ location.href = url; });
  });
  document.getElementById('pr').addEventListener('click', function(){ window.print(); });
})();
</script>
</body>
</html>
